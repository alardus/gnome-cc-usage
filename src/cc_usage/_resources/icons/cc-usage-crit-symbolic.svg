<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Circular gauge arc with critical exclamation accent, single-color symbolic -->
  <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="8" y1="8" x2="8" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Exclamation mark: vertical bar + dot -->
  <rect x="12" y="10" width="2" height="5" rx="1" fill="currentColor"/>
  <rect x="12" y="8" width="2" height="1.5" rx="0.75" fill="currentColor"/>
</svg>
